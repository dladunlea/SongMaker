<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Music Sequencer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .controls {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-group label {
            font-weight: bold;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select, input[type="range"] {
            padding: 8px;
            border-radius: 5px;
            border: none;
            background: rgba(255,255,255,0.2);
            color: #fff;
            font-size: 1em;
            cursor: pointer;
        }

        select option {
            background: #16213e;
            color: #fff;
        }

        input[type="range"] {
            width: 200px;
        }

        .bpm-display {
            font-size: 1.5em;
            font-weight: bold;
            color: #4ecdc4;
        }

        .resolution-buttons {
            display: flex;
            gap: 10px;
        }

        .resolution-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .resolution-btn.active {
            background: #4ecdc4;
            color: #1a1a2e;
        }

        .resolution-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .play-button {
            padding: 15px 40px;
            font-size: 1.2em;
            border: none;
            border-radius: 5px;
            background: #4ecdc4;
            color: #1a1a2e;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .play-button:hover {
            background: #45b8b0;
            transform: scale(1.05);
        }

        .play-button.playing {
            background: #ff6b6b;
        }

        .sequencer-container {
            background: rgba(0,0,0,0.3);
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
        }

        .instrument-label {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.2em;
            color: #4ecdc4;
        }

        .grid-container {
            display: inline-block;
            position: relative;
        }

        .progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 100%;
            background: rgba(78, 205, 196, 0.3);
            pointer-events: none;
            transition: left 0.05s linear;
            z-index: 1;
        }

        .grid {
            display: grid;
            gap: 2px;
            background: rgba(255,255,255,0.1);
            padding: 2px;
            border-radius: 5px;
            position: relative;
            z-index: 2;
        }

        .cell {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            transition: all 0.1s;
            border-radius: 3px;
        }

        .cell:hover {
            background: rgba(255,255,255,0.3);
        }

        .cell.active {
            background: #4ecdc4;
            box-shadow: 0 0 10px rgba(78, 205, 196, 0.6);
        }

        .note-labels {
            position: absolute;
            left: -60px;
            top: 2px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .note-label {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            font-weight: bold;
            color: #4ecdc4;
            font-size: 0.9em;
        }

        .beat-labels {
            display: flex;
            gap: 2px;
            margin-bottom: 5px;
            padding-left: 2px;
        }

        .beat-label {
            width: 40px;
            text-align: center;
            font-size: 0.8em;
            color: rgba(255,255,255,0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 Web Music Sequencer</h1>
        
        <div class="controls">
            <div class="control-group">
                <label>Instrument</label>
                <select id="instrumentSelect">
                    <option value="kick">Kick Drum</option>
                    <option value="snare">Snare</option>
                    <option value="hihat">Hi-Hat</option>
                    <option value="clap">Clap</option>
                    <option value="bass">Electric Bass</option>
                    <option value="lead">Lead Synth</option>
                    <option value="pad">Pad</option>
                    <option value="trumpet">Trumpet Choir</option>
                    <option value="choir">Voice Choir</option>
                    <option value="guitar">Guitar Strum</option>
                    <option value="hey">Voice: "Hey"</option>
                    <option value="tough">Voice: "That's Tough"</option>
                    <option value="weird">Voice: "That's a Weird Thing to Say"</option>
                </select>
            </div>

            <div class="control-group">
                <label>Musical Scale</label>
                <select id="scaleSelect">
                    <option value="ionian">Ionian (Major)</option>
                    <option value="dorian">Dorian</option>
                    <option value="phrygian">Phrygian</option>
                    <option value="lydian">Lydian</option>
                    <option value="mixolydian">Mixolydian</option>
                    <option value="aeolian">Aeolian (Minor)</option>
                    <option value="locrian">Locrian</option>
                </select>
            </div>

            <div class="control-group">
                <label>BPM: <span class="bpm-display" id="bpmDisplay">126</span></label>
                <input type="range" id="bpmSlider" min="60" max="200" value="126">
            </div>

            <div class="control-group">
                <label>Grid Resolution</label>
                <div class="resolution-buttons">
                    <button class="resolution-btn" data-resolution="4">4th</button>
                    <button class="resolution-btn active" data-resolution="8">8th</button>
                    <button class="resolution-btn" data-resolution="16">16th</button>
                </div>
            </div>

            <button class="play-button" id="playButton">▶ Play</button>
        </div>

        <div class="sequencer-container">
            <div class="instrument-label" id="currentInstrumentLabel">Kick Drum</div>
            <div class="beat-labels" id="beatLabels"></div>
            <div class="grid-container">
                <div class="note-labels" id="noteLabels"></div>
                <div class="progress-bar" id="progressBar"></div>
                <div class="grid" id="grid"></div>
            </div>
        </div>
    </div>

    <script>
        // Audio Context
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        // Configuration
        let bpm = 126;
        let currentBeat = 0;
        let isPlaying = false;
        let intervalId = null;
        let currentInstrument = 'kick';
        let currentScale = 'ionian';
        let gridResolution = 8;
        const beatsPerMeasure = 16;
        
        // Musical scales (intervals from root)
        const scales = {
            ionian: [0, 2, 4, 5, 7, 9, 11, 12],
            dorian: [0, 2, 3, 5, 7, 9, 10, 12],
            phrygian: [0, 1, 3, 5, 7, 8, 10, 12],
            lydian: [0, 2, 4, 6, 7, 9, 11, 12],
            mixolydian: [0, 2, 4, 5, 7, 9, 10, 12],
            aeolian: [0, 2, 3, 5, 7, 8, 10, 12],
            locrian: [0, 1, 3, 5, 6, 8, 10, 12]
        };
        
        // Instrument configurations
        const instruments = {
            kick: { type: 'drum', baseFreq: 150, notes: 1 },
            snare: { type: 'drum', baseFreq: 200, notes: 1 },
            hihat: { type: 'drum', baseFreq: 8000, notes: 1 },
            clap: { type: 'drum', baseFreq: 1000, notes: 1 },
            bass: { type: 'melodic', baseNote: 36, notes: 8 },
            lead: { type: 'melodic', baseNote: 60, notes: 8 },
            pad: { type: 'melodic', baseNote: 48, notes: 8 },
            trumpet: { type: 'melodic', baseNote: 55, notes: 8 },
            choir: { type: 'melodic', baseNote: 48, notes: 8 },
            guitar: { type: 'melodic', baseNote: 40, notes: 8 },
            hey: { type: 'voice', notes: 1 },
            tough: { type: 'voice', notes: 1 },
            weird: { type: 'voice', notes: 1 }
        };
        
        // Pattern storage for each instrument
        const patterns = {};
        Object.keys(instruments).forEach(inst => {
            const rows = instruments[inst].notes;
            patterns[inst] = Array(rows).fill(null).map(() => Array(beatsPerMeasure).fill(false));
        });
        
        // Voice sample management
        let voicePlaying = null;
        
        // DOM Elements
        const grid = document.getElementById('grid');
        const noteLabels = document.getElementById('noteLabels');
        const beatLabels = document.getElementById('beatLabels');
        const progressBar = document.getElementById('progressBar');
        const playButton = document.getElementById('playButton');
        const bpmSlider = document.getElementById('bpmSlider');
        const bpmDisplay = document.getElementById('bpmDisplay');
        const instrumentSelect = document.getElementById('instrumentSelect');
        const scaleSelect = document.getElementById('scaleSelect');
        const currentInstrumentLabel = document.getElementById('currentInstrumentLabel');
        
        // Initialize grid
        function initGrid() {
            grid.innerHTML = '';
            noteLabels.innerHTML = '';
            beatLabels.innerHTML = '';
            
            const rows = instruments[currentInstrument].notes;
            const cols = beatsPerMeasure;
            
            grid.style.gridTemplateColumns = `repeat(${cols}, 40px)`;
            grid.style.gridTemplateRows = `repeat(${rows}, 40px)`;
            
            // Beat labels
            for (let col = 0; col < cols; col++) {
                const label = document.createElement('div');
                label.className = 'beat-label';
                label.textContent = col + 1;
                beatLabels.appendChild(label);
            }
            
            // Note labels and grid cells
            for (let row = 0; row < rows; row++) {
                // Note label
                const label = document.createElement('div');
                label.className = 'note-label';
                if (instruments[currentInstrument].type === 'melodic') {
                    const noteIndex = rows - 1 - row;
                    label.textContent = getNoteNameForRow(noteIndex);
                } else if (instruments[currentInstrument].type === 'voice') {
                    label.textContent = '🎤';
                } else {
                    label.textContent = '🥁';
                }
                noteLabels.appendChild(label);
                
                // Grid cells
                for (let col = 0; col < cols; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    
                    if (patterns[currentInstrument][row][col]) {
                        cell.classList.add('active');
                    }
                    
                    cell.addEventListener('click', () => toggleCell(row, col));
                    grid.appendChild(cell);
                }
            }
        }
        
        function getNoteNameForRow(rowIndex) {
            const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
            const scaleIntervals = scales[currentScale];
            const interval = scaleIntervals[rowIndex % scaleIntervals.length];
            const octaveOffset = Math.floor(rowIndex / scaleIntervals.length);
            const midiNote = instruments[currentInstrument].baseNote + interval + (octaveOffset * 12);
            const noteName = noteNames[midiNote % 12];
            const octave = Math.floor(midiNote / 12) - 1;
            return `${noteName}${octave}`;
        }
        
        function toggleCell(row, col) {
            patterns[currentInstrument][row][col] = !patterns[currentInstrument][row][col];
            const cell = grid.querySelector(`[data-row="${row}"][data-col="${col}"]`);
            cell.classList.toggle('active');
        }
        
        // Audio synthesis
        function playDrum(frequency, duration = 0.1) {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            
            osc.type = frequency > 1000 ? 'square' : 'sine';
            osc.frequency.setValueAtTime(frequency, audioContext.currentTime);
            osc.frequency.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            
            gain.gain.setValueAtTime(0.5, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioContext.destination);
            
            osc.start();
            osc.stop(audioContext.currentTime + duration);
        }
        
        function playMelodicNote(instrument, midiNote, duration = 0.3) {
            const frequency = 440 * Math.pow(2, (midiNote - 69) / 12);
            
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            const filter = audioContext.createBiquadFilter();
            
            // Different waveforms for different instruments
            const waveforms = {
                bass: 'sawtooth',
                lead: 'square',
                pad: 'sine',
                trumpet: 'sawtooth',
                choir: 'triangle',
                guitar: 'sawtooth'
            };
            
            osc.type = waveforms[instrument] || 'sine';
            osc.frequency.setValueAtTime(frequency, audioContext.currentTime);
            
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(instrument === 'bass' ? 800 : 2000, audioContext.currentTime);
            
            const volume = instrument === 'pad' ? 0.15 : 0.3;
            gain.gain.setValueAtTime(volume, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioContext.destination);
            
            osc.start();
            osc.stop(audioContext.currentTime + duration);
        }
        
        function playVoiceSample(voiceType) {
            // Stop any currently playing voice
            if (voicePlaying) {
                voicePlaying.stop();
            }
            
            // Synthesize voice-like sounds
            const phrases = {
                hey: { freq: 400, duration: 0.15 },
                tough: { freq: 150, duration: 0.4 },
                weird: { freq: 350, duration: 0.5 }
            };
            
            const config = phrases[voiceType];
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            const filter = audioContext.createBiquadFilter();
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(config.freq, audioContext.currentTime);
            
            // Add formant-like filtering for voice quality
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(config.freq * 2, audioContext.currentTime);
            filter.Q.setValueAtTime(5, audioContext.currentTime);
            
            gain.gain.setValueAtTime(0.4, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + config.duration);
            
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(audioContext.destination);
            
            osc.start();
            osc.stop(audioContext.currentTime + config.duration);
            
            voicePlaying = osc;
        }
        
        // Playback engine
        function playBeat() {
            const beatTime = (60 / bpm) * (4 / gridResolution);
            
            // Play all instruments at current beat
            Object.keys(instruments).forEach(inst => {
                const pattern = patterns[inst];
                const config = instruments[inst];
                
                for (let row = 0; row < pattern.length; row++) {
                    if (pattern[row][currentBeat]) {
                        if (config.type === 'drum') {
                            playDrum(config.baseFreq);
                        } else if (config.type === 'melodic') {
                            const noteIndex = pattern.length - 1 - row;
                            const scaleIntervals = scales[currentScale];
                            const interval = scaleIntervals[noteIndex % scaleIntervals.length];
                            const octaveOffset = Math.floor(noteIndex / scaleIntervals.length);
                            const midiNote = config.baseNote + interval + (octaveOffset * 12);
                            playMelodicNote(inst, midiNote, beatTime * 0.8);
                        } else if (config.type === 'voice') {
                            playVoiceSample(inst);
                        }
                    }
                }
            });
            
            // Update progress bar
            const cellWidth = 42; // 40px + 2px gap
            progressBar.style.left = (currentBeat * cellWidth + 2) + 'px';
            progressBar.style.width = cellWidth + 'px';
            
            // Advance beat
            currentBeat = (currentBeat + 1) % beatsPerMeasure;
        }
        
        function startPlayback() {
            if (isPlaying) return;
            
            // Resume audio context if suspended
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            
            isPlaying = true;
            playButton.textContent = '⏸ Stop';
            playButton.classList.add('playing');
            
            const beatInterval = (60 / bpm) * (4 / gridResolution) * 1000;
            
            playBeat();
            intervalId = setInterval(playBeat, beatInterval);
        }
        
        function stopPlayback() {
            isPlaying = false;
            clearInterval(intervalId);
            currentBeat = 0;
            progressBar.style.left = '0px';
            playButton.textContent = '▶ Play';
            playButton.classList.remove('playing');
            
            if (voicePlaying) {
                voicePlaying.stop();
                voicePlaying = null;
            }
        }
        
        function updateBPM() {
            bpm = parseInt(bpmSlider.value);
            bpmDisplay.textContent = bpm;
            
            if (isPlaying) {
                stopPlayback();
                startPlayback();
            }
        }
        
        function changeInstrument() {
            currentInstrument = instrumentSelect.value;
            currentInstrumentLabel.textContent = instrumentSelect.options[instrumentSelect.selectedIndex].text;
            initGrid();
        }
        
        function changeScale() {
            currentScale = scaleSelect.value;
            if (instruments[currentInstrument].type === 'melodic') {
                initGrid();
            }
        }
        
        function changeResolution(resolution) {
            gridResolution = resolution;
            
            document.querySelectorAll('.resolution-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            if (isPlaying) {
                stopPlayback();
                startPlayback();
            }
        }
        
        // Event listeners
        playButton.addEventListener('click', () => {
            if (isPlaying) {
                stopPlayback();
            } else {
                startPlayback();
            }
        });
        
        bpmSlider.addEventListener('input', updateBPM);
        instrumentSelect.addEventListener('change', changeInstrument);
        scaleSelect.addEventListener('change', changeScale);
        
        document.querySelectorAll('.resolution-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const resolution = parseInt(e.target.dataset.resolution);
                changeResolution(resolution);
            });
        });
        
        // Initialize
        initGrid();
    </script>
</body>
</html>
