    <title>Beat Sequencer - 126 BPM</title>

            box-sizing: border-box;

        body {

            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);

            padding: 20px;

        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 32px;
        }

        .controls {
            text-align: center;
            margin-bottom: 30px;
        }

        .control-btn {
            padding: 15px 40px;
            font-size: 18px;
            background: white;
            color: #1e3c72;
            border: none;
            border-radius: 50px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s;
            margin: 0 10px;
            font-weight: bold;
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }
